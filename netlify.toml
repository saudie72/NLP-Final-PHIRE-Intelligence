# Netlify: build the React app in app/ and publish app/dist.
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: hash routing, so only the root is needed; keep a fallback for direct paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (reviewed by the Security Reviewer; see docs/security-review.md).
# connect-src 'self' means the page can only fetch from this site (the model file and demo export):
# uploaded ticket text cannot be sent anywhere else, even by mistake.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
