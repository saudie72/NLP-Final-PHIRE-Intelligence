# Netlify: run the NLTK + spaCy pipeline with Python (build time only; Netlify can't run Python at request time),
# then build the React app in app/ and publish app/dist.
[build]
  base = "app"
  command = "python3 -m pip install -r ../pipeline/requirements.txt && python3 ../pipeline/build_nlp.py && npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

# "Ask the expert" chat runs in app/netlify/functions/chat.mjs (path /api/chat).
# It stays switched off until ANTHROPIC_API_KEY is added under Site configuration > Environment variables.
# Optional APP_PASSWORD makes every chat request require a password.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: hash routing, so only the root is needed; keep a fallback for direct paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (reviewed by the Security Reviewer; see docs/security-review.md).
# connect-src 'self' means the page can only fetch from this site (the model file and demo export):
# uploaded ticket text cannot be sent anywhere else, even by mistake. The expert chat calls /api/chat on this
# same site; only the Netlify Function talks to Anthropic, with the key kept server-side.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# Always revalidate the page itself, so browsers (Edge included) never run an outdated index.html that points at
# asset files from an earlier deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
